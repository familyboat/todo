<header>
  <p>
    用不同的前端 UI 框架制作了同样功能的 todo
    应用，旨在学习并掌握各个框架搭建一个完整应用所需要用到的技术。
  </p>
  <p>
    每个应用均使用同一种存储方案——既每个应用共享相同的数据；每个应用的主体功能是完全一致的；每个应用尽可能地保持动画效果是一致的。
  </p>
</header>
<ul class="nav">
  @for (app of todoApps; track $index) {
  <li class="item">
    @if (app.url) {
    <a [href]="app.url" target="_blank" rel="noopener noreferrer">
      {{ app.title }}
    </a>
    } @else {
    {{ app.title }}
    }

    <span>
      {{ app.status }}
    </span>
  </li>
  }
</ul>
